    postSQL: ""
    preSQL: |2-
           |-
           UPDATE {{ ref('SILVER_DIM', 'STG_COMMISSION_CONTRACT') }} "CONTRACT"
            SET MONTHLY_SERVICE_TOTAL = SERVICE_TOTAL/"SUBS".TOTAL_BILLING , MONTHLY_PRODUCT_TOTAL = PRODUCT_TOTAL/"SUBS".TOTAL_BILLING ,MONTHLY_EQUIPMENT_TOTAL = EQUIPMENT_TOTAL /"SUBS".TOTAL_BILLING
            , MONTHLY_DISCOUNT_TOTAL = DISCOUNT_TOTAL,    DISCOUNT_TOTAL = DISCOUNT_TOTAL*"SUBS".TOTAL_BILLING , MONTHLY_NON_COMM_AMT = NON_COMM_AMT/"SUBS".TOTAL_BILLING
            FROM (
            SELECT ORDER_ID,  TOTAL_BILLING 
            FROM 
             {{ ref('SILVER_DIM', 'STG_COMMISSION_CONTRACT_INVOICE_CYCLE') }}   "CYCLE"
            ) "SUBS"
            WHERE "CONTRACT".ORDER_ID = "SUBS".ORDER
